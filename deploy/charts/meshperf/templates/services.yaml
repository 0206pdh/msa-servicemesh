{{- range $name, $service := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "meshperf.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
    meshperf.io/metrics: "true"
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
