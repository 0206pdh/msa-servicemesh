{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meshperf-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: meshperf
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meshperf-common-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: meshperf
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meshperf-java-observability
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [benchmark-gateway, orchestrator-service, workload-a, workload-b, workload-c, producer-service, worker-service]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.observabilityNamespace }}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.observabilityNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - {protocol: TCP, port: 4318}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: benchmark-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: benchmark-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [orchestrator-service, producer-service]
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: benchmark-gateway-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: benchmark-gateway
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - {protocol: TCP, port: "8080"}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orchestrator-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orchestrator-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: benchmark-gateway
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: workload-a
      ports:
        - {protocol: TCP, port: 8080}
---
{{- range $source, $target := dict "workload-a" "workload-b" "workload-b" "workload-c" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $source }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $source }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ if eq $source "workload-a" }}orchestrator-service{{ else }}workload-a{{ end }}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $target }}
      ports:
        - {protocol: TCP, port: 8080}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workload-c
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: workload-c
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [workload-b, workload-c]
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: workload-c
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: producer-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: producer-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: benchmark-gateway
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - {protocol: TCP, port: 9092}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: worker-service
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - {protocol: TCP, port: 9092}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [producer-service, worker-service, kafka]
      ports:
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 9093}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 9093}
{{- end }}
