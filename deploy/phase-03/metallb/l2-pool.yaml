apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: vmnet8-lab
  namespace: metallb-system
spec:
  addresses:
    - 192.168.200.100-192.168.200.110
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: vmnet8-lab
  namespace: metallb-system
spec:
  ipAddressPools:
    - vmnet8-lab
  interfaces:
    - ens32
