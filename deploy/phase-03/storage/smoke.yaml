apiVersion: v1
kind: Namespace
metadata:
  name: storage-smoke
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: storage-smoke
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: writer
  namespace: storage-smoke
spec:
  containers:
    - name: writer
      image: busybox:1.37.0
      command: ["sh", "-c", "echo local-path-persistence > /data/probe && sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
