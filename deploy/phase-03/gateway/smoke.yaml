apiVersion: v1
kind: Namespace
metadata:
  name: gateway-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: gateway-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-smoke-echo
  template:
    metadata:
      labels:
        app: gateway-smoke-echo
    spec:
      containers:
        - name: echo
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: gateway-smoke
spec:
  selector:
    app: gateway-smoke-echo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: smoke
  namespace: gateway-smoke
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: smoke
  namespace: gateway-smoke
spec:
  parentRefs:
    - name: smoke
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: echo
          port: 80
