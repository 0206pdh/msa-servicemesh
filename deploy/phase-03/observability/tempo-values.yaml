tempo:
  retention: 24h
  # Keep the legacy ballast well below the container limit. The chart default
  # of 1024 MiB causes Tempo to be OOMKilled in this small lab.
  memBallastSizeMbs: 128
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1536Mi

persistence:
  enabled: true
  storageClassName: local-path
  size: 2Gi

nodeSelector:
  kubernetes.io/hostname: mesh-cp-01
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

serviceMonitor:
  enabled: true
