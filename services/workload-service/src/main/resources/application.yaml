spring:
  application:
    name: workload-service
server:
  port: ${SERVER_PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
mesh-perf:
  image-digest: ${IMAGE_DIGEST:local}
  workload-role: ${WORKLOAD_ROLE:target-a}
  next-base-url: ${WORKLOAD_NEXT_BASE_URL:http://localhost:8082}
