spring:
  application:
    name: producer-service
server:
  port: ${SERVER_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
mesh-perf:
  image-digest: ${IMAGE_DIGEST:local}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:none}
