spring:
  application:
    name: benchmark-gateway
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: 1.0
mesh-perf:
  orchestrator:
    base-url: ${ORCHESTRATOR_BASE_URL:http://localhost:8081}
