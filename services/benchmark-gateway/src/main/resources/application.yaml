spring:
  application:
    name: benchmark-gateway
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
mesh-perf:
  image-digest: ${IMAGE_DIGEST:local}
  orchestrator:
    base-url: ${ORCHESTRATOR_BASE_URL:http://localhost:8081}
  producer:
    base-url: ${PRODUCER_BASE_URL:http://localhost:8083}
