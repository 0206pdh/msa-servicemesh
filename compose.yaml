name: mesh-performance-lab

services:
  benchmark-gateway:
    build: services/benchmark-gateway
    environment:
      SERVER_PORT: 8080
      ORCHESTRATOR_BASE_URL: http://orchestrator-service:8080
      PRODUCER_BASE_URL: http://producer-service:8080
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_TRACES_EXPORTER: none
    ports: ["8080:8080"]
    depends_on:
      orchestrator-service:
        condition: service_healthy
      producer-service:
        condition: service_healthy
    healthcheck: &java-health
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20

  orchestrator-service:
    build: services/orchestrator-service
    environment:
      SERVER_PORT: 8080
      WORKLOAD_BASE_URL: http://workload-service:8080
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_TRACES_EXPORTER: none
    ports: ["8081:8080"]
    healthcheck: *java-health

  workload-service:
    build: services/workload-service
    environment:
      SERVER_PORT: 8080
      WORKLOAD_ROLE: target-a
      WORKLOAD_NEXT_BASE_URL: http://workload-service:8080
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_TRACES_EXPORTER: none
    ports: ["8082:8080"]
    healthcheck: *java-health

  producer-service:
    build: services/producer-service
    environment:
      SERVER_PORT: 8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_TRACES_EXPORTER: none
    ports: ["8083:8080"]
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck: *java-health

  worker-service:
    build: services/worker-service
    environment:
      SERVER_PORT: 8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_TRACES_EXPORTER: none
    ports: ["8084:8080"]
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck: *java-health

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MESSAGE_MAX_BYTES: 15000000
      KAFKA_REPLICA_FETCH_MAX_BYTES: 15000000
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build: apps/web
    ports: ["3000:80"]
    depends_on:
      benchmark-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
